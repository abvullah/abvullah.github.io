<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#0d0d0d">

</head>
<body>

<div class="wrap">

  <p class="crumb"><a href="index.html">Abdullah Mohammad</a></p>

  <h1>Post Title</h1>

  <p>Write the post here. When it's ready: rename this file to a URL-friendly

  a link to it from <code>posts.html</code>.</p>

</div>
<script src="theme.js"></script>
</body>
</html>
